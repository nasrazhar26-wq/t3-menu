<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم T3</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f4f7f5;
color:#17231c;
}

button,input,select,textarea{
font:inherit;
}

header{
background:linear-gradient(135deg,#087f3e,#f39a19);
color:#fff;
padding:18px;
position:sticky;
top:0;
z-index:20;
box-shadow:0 3px 15px #0002;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.logo{
font-size:28px;
font-weight:900;
}

.status{
font-size:13px;
background:#ffffff22;
padding:7px 12px;
border-radius:20px;
}

.container{
max-width:1100px;
margin:20px auto;
padding:0 14px;
}

.login{
max-width:480px;
margin:70px auto;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 8px 30px #0001;
}

h1,h2,h3{
margin-top:0;
}

input,select,textarea{
width:100%;
padding:13px;
border:1px solid #d8dedb;
border-radius:10px;
background:#fff;
outline:none;
}

input:focus,select:focus,textarea:focus{
border-color:#07833f;
}

label{
display:block;
font-weight:bold;
margin:12px 0 6px;
}

.btn{
border:0;
padding:12px 17px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.green{
background:#087f3e;
color:white;
}

.orange{
background:#f39a19;
color:white;
}

.red{
background:#d93636;
color:white;
}

.gray{
background:#e8ecea;
color:#222;
}

.btn:disabled{
opacity:.5;
cursor:not-allowed;
}

.card{
background:#fff;
border-radius:18px;
padding:18px;
margin-bottom:18px;
box-shadow:0 5px 20px #0000000d;
}

.tabs{
display:flex;
gap:8px;
overflow:auto;
margin-bottom:18px;
}

.tab{
white-space:nowrap;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.product{
border:1px solid #e1e6e3;
border-radius:15px;
padding:14px;
background:#fff;
}

.product img{
width:100%;
height:150px;
object-fit:cover;
border-radius:12px;
background:#eee;
}

.product-title{
font-weight:900;
font-size:18px;
margin:10px 0;
}

.price-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}

.price-grid div{
background:#f1f5f2;
padding:8px;
border-radius:8px;
text-align:center;
font-size:13px;
}

.actions{
display:flex;
gap:7px;
margin-top:12px;
flex-wrap:wrap;
}

.hidden{
display:none!important;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:15px;
font-size:12px;
font-weight:bold;
}

.show{
background:#dff5e7;
color:#087f3e;
}

.hide{
background:#ffe1e1;
color:#a52222;
}

.role{
padding:10px;
background:#f1f5f2;
border-radius:10px;
margin-bottom:15px;
text-align:center;
font-weight:bold;
}

.preview{
max-width:160px;
max-height:160px;
border-radius:12px;
margin-top:10px;
display:none;
}

.notice{
padding:12px;
border-radius:10px;
margin-bottom:12px;
background:#fff3cd;
color:#765b00;
}

.success{
background:#dff5e7;
color:#087f3e;
}

.error{
background:#ffe1e1;
color:#a52222;
}

@media(max-width:650px){
.grid,
.products{
grid-template-columns:1fr;
}

.price-grid{
grid-template-columns:repeat(2,1fr);
}

.header{
align-items:flex-start;
flex-direction:column;
}
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">T3 🥤 لوحة التحكم</div>
<div id="status" class="status">غير متصل</div>
</div>
</header>

<div class="container">

<!-- LOGIN -->
<section id="loginBox" class="login">

<h2>تسجيل الدخول</h2>

<div class="notice">
اختر نوع الحساب ثم أدخل بيانات الدخول.
</div>

<label>نوع الحساب</label>

<select id="role">
<option value="admin">الأدمن</option>
<option value="teacher">المعلم</option>
</select>

<label>اسم المستخدم</label>
<input id="username" placeholder="اسم المستخدم">

<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور">

<button class="btn green" style="width:100%;margin-top:15px"
onclick="login()">
دخول
</button>

</section>


<!-- ADMIN PANEL -->
<section id="panel" class="hidden">

<div class="role">
<span id="welcome"></span>
</div>

<div id="message"></div>

<!-- GITHUB CONNECTION -->
<div class="card">

<h2>🔗 ربط GitHub</h2>

<p>
أدخل GitHub Token الخاص بالمستودع
<strong>t3-menu</strong>.
</p>

<label>GitHub Token</label>

<input
id="token"
type="password"
placeholder="الصق GitHub Token هنا">

<button class="btn green" style="margin-top:10px"
onclick="connectGitHub()">
اتصال بـ GitHub
</button>

<button class="btn gray" style="margin-top:10px"
onclick="logout()">
تسجيل خروج
</button>

</div>


<!-- TABS -->

<div class="tabs">

<button class="btn green tab" onclick="showTab('products')">
🥤 المنتجات
</button>

<button class="btn orange tab adminOnly" onclick="showTab('categories')">
📂 الأقسام
</button>

<button class="btn gray tab adminOnly" onclick="showTab('settings')">
⚙️ الإعدادات
</button>

</div>


<!-- PRODUCTS -->

<section id="productsTab">

<div class="card">

<h2>🥤 إدارة المنتجات</h2>

<div class="grid">

<div>
<label>اسم المنتج</label>
<input id="pName" placeholder="مثال: مانجو سادة">
</div>

<div>
<label>القسم</label>
<select id="pCategory"></select>
</div>

</div>

<label>صورة المنتج</label>
<input id="pImage" type="file" accept="image/*" onchange="previewImage()">

<img id="imagePreview" class="preview">

<div class="grid">

<div>
<label>الصغير</label>
<input id="pSmall" type="number" placeholder="السعر">
</div>

<div>
<label>المتوسط</label>
<input id="pMedium" type="number" placeholder="السعر">
</div>

<div>
<label>الكبير</label>
<input id="pLarge" type="number" placeholder="السعر">
</div>

<div>
<label>جالون متوسط</label>
<input id="pGallonMedium" type="number" placeholder="السعر">
</div>

<div>
<label>جالون كبير</label>
<input id="pGallonLarge" type="number" placeholder="السعر">
</div>

</div>

<label>ظهور المنتج</label>

<select id="pVisible">
<option value="true">ظاهر</option>
<option value="false">مخفي</option>
</select>

<div class="actions">

<button class="btn green" onclick="saveProduct()">
💾 حفظ المنتج
</button>

<button class="btn gray" onclick="clearForm()">
مسح
</button>

</div>

<input id="editId" type="hidden">

</div>


<div class="card">

<h2>المنتجات الحالية</h2>

<div id="productsList" class="products">
لا توجد منتجات محملة.
</div>

</div>

</section>


<!-- CATEGORIES -->

<section id="categoriesTab" class="hidden adminOnly">

<div class="card">

<h2>📂 إدارة الأقسام</h2>

<label>اسم القسم</label>

<input id="categoryName" placeholder="مثال: العصيرات">

<button class="btn green"
style="margin-top:10px"
onclick="addCategory()">
إضافة قسم
</button>

<div id="categoriesList" style="margin-top:15px"></div>

</div>

</section>


<!-- SETTINGS -->

<section id="settingsTab" class="hidden adminOnly">

<div class="card">

<h2>⚙️ إعدادات الموقع</h2>

<label>اسم المتجر</label>
<input id="shopName" value="T3 للعصائر">

<label>رقم واتساب</label>
<input id="whatsapp" value="+966507423329">

<label>العنوان</label>

<textarea id="address" rows="4">
جدة - البغدادية الغربية - شارع المدارس مع تقاطع نهج طيبة - خلف لولو هايبر ماركت
</textarea>

<label>لون الموقع الرئيسي</label>
<input id="primaryColor" type="color" value="#087f3e">

<label>اللون الثانوي</label>
<input id="secondaryColor" type="color" value="#f39a19">

<button class="btn green"
style="margin-top:15px"
onclick="saveSettings()">
💾 حفظ الإعدادات
</button>

</div>

</section>

</section>

</div>


<script>

/* =========================
   إعدادات GitHub
========================= */

const OWNER = "nasrazhar26-wq";
const REPO = "t3-menu";
const BRANCH = "main";

const DATA_FILE = "data.json";

let githubToken = "";
let currentUser = "";
let currentRole = "";

let data = {
    settings:{
        shopName:"T3 للعصائر",
        whatsapp:"+966507423329",
        address:"جدة - البغدادية الغربية - شارع المدارس مع تقاطع نهج طيبة - خلف لولو هايبر ماركت",
        primaryColor:"#087f3e",
        secondaryColor:"#f39a19"
    },

    categories:[
        "العصيرات",
        "أصناف إضافية",
        "خلطات أخرى"
    ],

    products:[]
};


/* =========================
   الحسابات
========================= */

const ACCOUNTS = {

    admin:{
        username:"admin",
        password:"T3Admin@2026"
    },

    teacher:{
        username:"teacher",
        password:"T3Teacher@2026"
    }

};


/* =========================
   تسجيل الدخول
========================= */

function login(){

    const role =
        document.getElementById("role").value;

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if(
        username !== ACCOUNTS[role].username ||
        password !== ACCOUNTS[role].password
    ){

        alert("اسم المستخدم أو كلمة المرور غير صحيحة");
        return;
    }

    currentRole = role;
    currentUser = username;

    document.getElementById("loginBox")
        .classList.add("hidden");

    document.getElementById("panel")
        .classList.remove("hidden");

    document.getElementById("welcome").textContent =
        role === "admin"
        ? "مرحباً بك أيها الأدمن 👑"
        : "مرحباً بك أيها المعلم 👨‍🏫";

    if(role === "teacher"){

        document.querySelectorAll(".adminOnly")
        .forEach(el => el.classList.add("hidden"));

    }

    loadLocalData();

}


/* =========================
   تسجيل خروج
========================= */

function logout(){

    location.reload();

}


/* =========================
   رسالة
========================= */

function message(text,type="success"){

    const box =
        document.getElementById("message");

    box.className =
        "notice " + type;

    box.textContent = text;

    setTimeout(()=>{
        box.textContent="";
        box.className="";
    },4000);

}


/* =========================
   الاتصال بـ GitHub
========================= */

async function connectGitHub(){

    const token =
        document.getElementById("token").value.trim();

    if(!token){

        message("أدخل GitHub Token أولاً","error");
        return;
    }

    githubToken = token;

    try{

        const response =
            await githubRequest(
                `/repos/${OWNER}/${REPO}`
            );

        if(!response.ok){

            throw new Error("فشل الاتصال");

        }

        document.getElementById("status")
            .textContent="🟢 GitHub متصل";

        message("تم الاتصال بـ GitHub بنجاح");

        await loadFromGitHub();

    }catch(error){

        githubToken="";

        document.getElementById("status")
            .textContent="🔴 غير متصل";

        message(
            "تعذر الاتصال بـ GitHub. تأكد من التوكن والصلاحيات.",
            "error"
        );

    }

}


/* =========================
   GitHub Request
========================= */

async function githubRequest(path,options={}){

    return fetch(
        "https://api.github.com" + path,
        {
            ...options,
            headers:{
                "Accept":"application/vnd.github+json",
                "Authorization":"Bearer " + githubToken,
                "X-GitHub-Api-Version":"2022-11-28",
                ...(options.headers || {})
            }
        }
    );

}


/* =========================
   تحميل data.json
========================= */

async function loadFromGitHub(){

    try{

        const response =
            await githubRequest(
                `/repos/${OWNER}/${REPO}/contents/${DATA_FILE}?ref=${BRANCH}`
            );

        if(response.status === 404){

            await saveDataToGitHub();
            return;
        }

        if(!response.ok)
            throw new Error();

        const file =
            await response.json();

        const json =
            decodeBase64(file.content);

        data =
            JSON.parse(json);

        localStorage.setItem(
            "t3_data",
            JSON.stringify(data)
        );

        refreshAll();

        message("تم تحميل بيانات الموقع من GitHub");

    }catch(e){

        message(
            "تعذر تحميل data.json",
            "error"
        );

    }

}


/* =========================
   حفظ data.json في GitHub
========================= */

async function saveDataToGitHub(){

    if(!githubToken){

        message(
            "اتصل بـ GitHub أولاً",
            "error"
        );

        return false;
    }

    try{

        let sha = null;

        const existing =
            await githubRequest(
                `/repos/${OWNER}/${REPO}/contents/${DATA_FILE}?ref=${BRANCH}`
            );

        if(existing.ok){

            const old =
                await existing.json();

            sha = old.sha;

        }

        const content =
            utf8ToBase64(
                JSON.stringify(data,null,2)
            );

        const body = {

            message:"Update T3 menu data",

            content:content,

            branch:BRANCH

        };

        if(sha)
            body.sha=sha;

        const response =
            await githubRequest(
                `/repos/${OWNER}/${REPO}/contents/${DATA_FILE}`,
                {
                    method:"PUT",
                    body:JSON.stringify(body)
                }
            );

        if(!response.ok){

            const error =
                await response.text();

            console.log(error);

            throw new Error();

        }

        localStorage.setItem(
            "t3_data",
            JSON.stringify(data)
        );

        message(
            "✅ تم الحفظ في GitHub بنجاح"
        );

        return true;

    }catch(e){

        message(
            "❌ فشل الحفظ في GitHub",
            "error"
        );

        return false;

    }

}


/* =========================
   المنتجات
========================= */

async function saveProduct(){

    const name =
        document.getElementById("pName").value.trim();

    if(!name){

        alert("اكتب اسم المنتج");
        return;
    }

    const product = {

        id:
            document.getElementById("editId").value
            || Date.now().toString(),

        name:name,

        category:
            document.getElementById("pCategory").value,

        image:"",

        prices:{

            small:
                Number(document.getElementById("pSmall").value) || 0,

            medium:
                Number(document.getElementById("pMedium").value) || 0,

            large:
                Number(document.getElementById("pLarge").value) || 0,

            gallonMedium:
                Number(document.getElementById("pGallonMedium").value) || 0,

            gallonLarge:
                Number(document.getElementById("pGallonLarge").value) || 0

        },

        visible:
            document.getElementById("pVisible").value === "true"

    };


    const imageFile =
        document.getElementById("pImage").files[0];


    /* رفع الصورة */

    if(imageFile){

        if(!githubToken){

            alert("اتصل بـ GitHub أولاً حتى تستطيع رفع الصورة");
            return;

        }

        try{

            const extension =
                imageFile.name
                .split(".")
                .pop()
                .toLowerCase();

            const filename =
                "images/products/" +
                product.id +
                "-" +
                Date.now() +
                "." +
                extension;

            const base64 =
                await fileToBase64(imageFile);

            const response =
                await githubRequest(
                    `/repos/${OWNER}/${REPO}/contents/${filename}`,
                    {
                        method:"PUT",
                        body:JSON.stringify({

                            message:"Add T3 product image",

                            content:base64,

                            branch:BRANCH

                        })
                    }
                );

            if(!response.ok){

                throw new Error();

            }

            product.image =
                "images/products/" +
                filename.split("/").pop();

        }catch(e){

            alert("فشل رفع الصورة");
            return;

        }

    }


    const editId =
        document.getElementById("editId").value;

    if(editId){

        const index =
            data.products.findIndex(
                p => p.id === editId
            );

        if(index !== -1){

            if(!product.image)
                product.image =
                    data.products[index].image || "";

            data.products[index]=product;

        }

    }else{

        data.products.push(product);

    }


    clearForm();

    refreshAll();

    await saveDataToGitHub();

}


/* =========================
   تعديل منتج
========================= */

function editProduct(id){

    const p =
        data.products.find(
            x=>x.id===id
        );

    if(!p) return;

    document.getElementById("editId").value=p.id;

    document.getElementById("pName").value=p.name;

    document.getElementById("pCategory").value=p.category;

    document.getElementById("pSmall").value=p.prices?.small || "";

    document.getElementById("pMedium").value=p.prices?.medium || "";

    document.getElementById("pLarge").value=p.prices?.large || "";

    document.getElementById("pGallonMedium").value=
        p.prices?.gallonMedium || "";

    document.getElementById("pGallonLarge").value=
        p.prices?.gallonLarge || "";

    document.getElementById("pVisible").value=
        String(p.visible !== false);

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   حذف
========================= */

async function deleteProduct(id){

    if(!confirm("هل تريد حذف المنتج؟"))
        return;

    data.products =
        data.products.filter(
            p=>p.id!==id
        );

    refreshAll();

    await saveDataToGitHub();

}


/* =========================
   إظهار / إخفاء
========================= */

async function toggleProduct(id){

    const p =
        data.products.find(
            x=>x.id===id
        );

    if(!p) return;

    p.visible =
        p.visible === false;

    refreshAll();

    await saveDataToGitHub();

}


/* =========================
   الأقسام
========================= */

async function addCategory(){

    if(currentRole!=="admin")
        return;

    const input =
        document.getElementById("categoryName");

    const name =
        input.value.trim();

    if(!name) return;

    if(data.categories.includes(name)){

        alert("القسم موجود بالفعل");
        return;

    }

    data.categories.push(name);

    input.value="";

    refreshAll();

    await saveDataToGitHub();

}


async function deleteCategory(name){

    if(currentRole!=="admin")
        return;

    const used =
        data.products.some(
            p=>p.category===name
        );

    if(used){

        alert(
            "لا يمكن حذف القسم لأن هناك منتجات داخله."
        );

        return;
    }

    data.categories =
        data.categories.filter(
            c=>c!==name
        );

    refreshAll();

    await saveDataToGitHub();

}


/* =========================
   الإعدادات
========================= */

async function saveSettings(){

    if(currentRole!=="admin")
        return;

    data.settings={

        shopName:
            document.getElementById("shopName").value,

        whatsapp:
            document.getElementById("whatsapp").value,

        address:
            document.getElementById("address").value,

        primaryColor:
            document.getElementById("primaryColor").value,

        secondaryColor:
            document.getElementById("secondaryColor").value

    };

    await saveDataToGitHub();

}


/* =========================
   عرض المنتجات
========================= */

function renderProducts(){

    const box =
        document.getElementById("productsList");

    if(!data.products.length){

        box.innerHTML=
            "<p>لا توجد منتجات.</p>";

        return;

    }

    box.innerHTML =
        data.products.map(p=>{

            const image =
                p.image
                ? p.image
                : "";

            return `

            <div class="product">

                ${
                    image
                    ?
                    `<img src="${image}" onerror="this.style.display='none'">`
                    :
                    ""
                }

                <div class="product-title">
                    ${escapeHtml(p.name)}
                </div>

                <span class="badge ${
                    p.visible===false
                    ? "hide"
                    : "show"
                }">

                ${
                    p.visible===false
                    ? "مخفي"
                    : "ظاهر"
                }

                </span>

                <p>
                القسم:
                ${escapeHtml(p.category || "")}
                </p>

                <div class="price-grid">

                    <div>
                    صغير<br>
                    ${p.prices?.small || 0}
                    </div>

                    <div>
                    متوسط<br>
                    ${p.prices?.medium || 0}
                    </div>

                    <div>
                    كبير<br>
                    ${p.prices?.large || 0}
                    </div>

                    <div>
                    جالون متوسط<br>
                    ${p.prices?.gallonMedium || 0}
                    </div>

                    <div>
                    جالون كبير<br>
                    ${p.prices?.gallonLarge || 0}
                    </div>

                </div>

                <div class="actions">

                    <button
                    class="btn orange"
                    onclick="editProduct('${p.id}')">
                    تعديل
                    </button>

                    <button
                    class="btn gray"
                    onclick="toggleProduct('${p.id}')">
                    ${p.visible===false ? "إظهار" : "إخفاء"}
                    </button>

                    <button
                    class="btn red"
                    onclick="deleteProduct('${p.id}')">
                    حذف
                    </button>

                </div>

            </div>

            `;

        }).join("");

}


/* =========================
   عرض الأقسام
========================= */

function renderCategories(){

    const select =
        document.getElementById("pCategory");

    select.innerHTML =
        data.categories.map(
            c=>`
            <option value="${escapeAttr(c)}">
            ${escapeHtml(c)}
            </option>
            `
        ).join("");

    const list =
        document.getElementById("categoriesList");

}

/* =========================
   Base64
========================= */

function utf8ToBase64(str){

    return btoa(
        unescape(
            encodeURIComponent(str)
        )
    );

}


function decodeBase64(str){

    return decodeURIComponent(
        escape(
            atob(
                str.replace(/\n/g,"")
            )
        )
    );

}


/* =========================
   تحويل الصورة
========================= */

function fileToBase64(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload=()=>{

                resolve(
                    reader.result
                    .split(",")[1]
                );

            };

            reader.onerror=reject;

            reader.readAsDataURL(file);

        }
    );

}


/* =========================
   حماية HTML
========================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttr(value){

    return String(value)
        .replaceAll("\\","\\\\")
        .replaceAll("'","&#039;")
        .replaceAll('"',"&quot;");

}
