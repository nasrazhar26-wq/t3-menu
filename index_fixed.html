    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatPrice(value) {
      if (value === null || value === undefined || value === "") return "";
      const n = Number(value);
      if (!Number.isFinite(n)) return String(value);
      return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
    }

    function whatsappNumber(raw) {
      return String(raw || "").replace(/[^\d]/g, "");
    }

    function applyTheme() {
      const theme = state.settings?.theme || {};
      const map = {
        primary: "--primary",
        secondary: "--secondary",
        accent: "--accent",
        background: "--background",
        card: "--card",
        text: "--text",
        muted: "--muted",
        button: "--button",
        whatsapp: "--whatsapp",
        cart: "--cart",
        headings: "--heading",
        category: "--category"
      };
      Object.entries(map).forEach(([key, css]) => {
        if (theme[key]) document.documentElement.style.setProperty(css, theme[key]);
      });
      if (state.settings?.primary_color) document.documentElement.style.setProperty("--primary", state.settings.primary_color);
      if (state.settings?.secondary_color) document.documentElement.style.setProperty("--secondary", state.settings.secondary_color);
      if (state.settings?.accent_color) document.documentElement.style.setProperty("--accent", state.settings.accent_color);
      if (state.settings?.background_color) document.documentElement.style.setProperty("--background", state.settings.background_color);
      if (state.settings?.text_color) document.documentElement.style.setProperty("--text", state.settings.text_color);
    }

    function renderStatic() {
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";

      const storeName = text(setting("store_name"), setting("store_name_en"));
      const tagline = text(setting("tagline"), setting("tagline_en"));
      const cartLabel = text(setting("cart_label"), setting("cart_label_en"));
      const cartTitle = text(setting("cart_title"), setting("cart_title_en"));
      const menuLabel = text(setting("menu_label"), setting("menu_label_en"));

      $("brandName").textContent = storeName;
      $("brandTagline").textContent = tagline;
      $("heroKicker").textContent = "";
      $("heroTitle").textContent = text(setting("hero_title"), setting("hero_title_en")) || storeName;
      $("heroSubtitle").textContent = text(setting("hero_subtitle"), setting("hero_subtitle_en")) || tagline;
      $("cartLabel").textContent = cartLabel;
      $("cartTitle").textContent = cartTitle;
      $("menuLabel").textContent = menuLabel;
      $("menuTitle").textContent = menuLabel;

      $("search").placeholder = text(setting("search_placeholder"), setting("search_placeholder_en"));
      $("locationTitle").textContent = text(setting("location_title"), setting("location_title_en"));
      $("phoneLabel").textContent = text(setting("phone_label"), setting("phone_label_en"));
      $("addressValue").textContent = state.lang === "en" ? setting("address_en") : setting("address");
      $("phoneValue").textContent = setting("phone");
      $("footerText").textContent = text(setting("footer_text"), setting("footer_text_en"));
      $("footerSubtitle").textContent = text(setting("footer_subtitle"), setting("footer_subtitle_en"));
      $("orderBtn").textContent = text(setting("order_button_text"), setting("order_button_text_en"));
      $("heroMenuBtn").textContent = menuLabel;
      $("heroWhatsappBtn").textContent = "💬 " + (state.lang === "en" ? "WhatsApp" : "واتساب");
      $("phoneBtn").textContent = state.lang === "en" ? "📞 Call" : "📞 اتصال";
      $("whatsappBtn").textContent = state.lang === "en" ? "💬 WhatsApp" : "💬 واتساب";
      $("clearCartBtn").textContent = state.lang === "en" ? "Clear Cart" : "تفريغ السلة";
      $("totalLabel").textContent = state.lang === "en" ? "Total" : "الإجمالي";
      $("langBtn").textContent = state.lang === "ar" ? "EN" : "عربي";

      const logo = setting("logo_url") || "logo.png";
      $("logoWrap").innerHTML = `<img src="${escapeHtml(logo)}" alt="${escapeHtml(storeName)}" />`;

      const heroImage = setting("hero_image_url");
      if (heroImage) {
        $("heroBg").src = heroImage;
        $("heroBg").style.display = "block";
      } else {
        $("heroBg").style.display = "none";
      }

      const phone = String(setting("phone") || "").replace(/[^\d+]/g, "");
      $("phoneBtn").href = phone ? `tel:${phone}` : "#";
      const wa = whatsappNumber(setting("whatsapp_number") || setting("phone"));
      $("whatsappBtn").href = wa ? `https://wa.me/${wa}` : "#";
    }

    async function loadData() {
      if (!db) {
        renderStatic();
        renderCategories();
        renderProducts();
        renderContact();
        updateCart();
        showToast(state.lang === "en"
          ? "Supabase is not configured."
          : "تعذر الاتصال بقاعدة البيانات.");
        return;
      }

      // كل قسم يُحمّل بشكل مستقل حتى لا يمنع خطأ في الإعلانات ظهور المنتجات.
      const results = await Promise.allSettled([
        db.from("settings").select("*").limit(1).maybeSingle(),
        db.from("categories").select("*").order("sort_order", { ascending: true }),
        db.from("products").select("*").order("sort_order", { ascending: true }),
        db.from("ads").select("*").order("sort_order", { ascending: true })
      ]);

      const [settingsR, categoriesR, productsR, adsR] = results;
      const errors = [];

      if (settingsR.status === "fulfilled" && !settingsR.value.error) {
        state.settings = settingsR.value.data || {};
      } else {
        errors.push(settingsR.reason?.message || settingsR.value?.error?.message || "settings");
      }

      if (categoriesR.status === "fulfilled" && !categoriesR.value.error) {
        state.categories = categoriesR.value.data || [];
      } else {
        errors.push(categoriesR.reason?.message || categoriesR.value?.error?.message || "categories");
      }

      if (productsR.status === "fulfilled" && !productsR.value.error) {
        // نقرأ المنتجات كلها ثم نخفي المخفي منها محليًا؛ هذا يجعل الواجهة أكثر تحمّلًا لاختلافات الـ schema.
        state.products = (productsR.value.data || []).filter(p => p.visible !== false);
      } else {
        errors.push(productsR.reason?.message || productsR.value?.error?.message || "products");
      }

      if (adsR.status === "fulfilled" && !adsR.value.error) {
        state.ads = (adsR.value.data || []).filter(a => a.visible !== false);
      } else {
        // الإعلانات اختيارية؛ لا نوقف المنيو بسببها.
        state.ads = [];
      }

      applyTheme();
      renderStatic();
      renderCategories();
      renderProducts();
      renderAds();
      renderContact();
      renderMenuLinks();
      updateCart();

      if (errors.length) {
        console.warn("T3 partial load:", errors);
        showToast(state.lang === "en"
          ? "Some optional data could not be loaded."
          : "تم تحميل المنيو، وبعض البيانات الاختيارية لم تُحمّل.");
      }
    }

    function renderCategories() {
      const visible = state.categories.filter(c => c.visible !== false);
      let html = `<button class="cat ${state.category === "all" ? "active" : ""}" data-cat="all">${state.lang === "ar" ? "الكل" : "All"}</button>`;
      visible.forEach(c => {
        const active = state.category === c.id ? "active" : "";
        html += `<button class="cat ${active}" data-cat="${escapeHtml(c.id)}">${escapeHtml(text(c.name, c.name_en))}</button>`;
      });
      $("categories").innerHTML = html;
      $("categories").querySelectorAll(".cat").forEach(btn => {
        btn.addEventListener("click", () => {
          state.category = btn.dataset.cat;
          renderCategories();
          renderProducts();
        });
      });
    }

    function getSizes(product) {
      const sizes = product.sizes || {};
      return Object.entries(sizeLabels)
        .filter(([key]) => sizes[key] && sizes[key].enabled && sizes[key].price !== null && sizes[key].price !== "")
        .map(([key, label]) => ({ key, ...label, price: sizes[key].price }));
    }

    function filteredProducts() {
      const q = state.search.trim().toLowerCase();
      return state.products.filter(p => {
        if (state.category !== "all" && p.category_id !== state.category) return false;
        if (!q) return true;
        const haystack = [
          p.name, p.name_en, p.description, p.description_en
        ].filter(Boolean).join(" ").toLowerCase();
        return haystack.includes(q);
      });
    }

    function renderProducts() {
      const products = filteredProducts();
      const countText = state.lang === "en"
        ? `${products.length} item${products.length === 1 ? "" : "s"}`
        : `${products.length} صنف`;
      $("itemCount").textContent = countText;

      if (!products.length) {
        const noSearch = state.search.trim();
        const msg = noSearch
          ? text(setting("no_results_text"), setting("no_results_text_en"))
          : text(setting("empty_products_text"), setting("empty_products_text_en"));
        $("products").innerHTML = `
          <div class="empty" style="grid-column:1/-1">
            <div class="empty-icon">🍹</div>
            <strong>${escapeHtml(msg)}</strong>
          </div>`;
        return;
      }

      $("products").innerHTML = products.map(p => {
        const sizes = getSizes(p);
        const image = p.image_url
          ? `<img loading="lazy" src="${escapeHtml(p.image_url)}" alt="${escapeHtml(text(p.name,p.name_en))}" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\"no-image\">🍹</div>'" />`
          : `<div class="no-image">🍹</div>`;
        const desc = text(p.description, p.description_en);
        const name = text(p.name, p.name_en);
        const enName = state.lang === "ar" ? p.name_en : p.name;
        const selectedKey = "";

        return `
          <article class="product" data-product-card="${escapeHtml(p.id)}">
            <div class="product-image">${image}</div>
            <div class="product-body">
              <h3 class="product-name">${escapeHtml(name)}</h3>
              ${enName ? `<div class="product-en">${escapeHtml(enName)}</div>` : ""}
              ${desc ? `<p class="product-desc">${escapeHtml(desc)}</p>` : ""}
              <div class="sizes" data-sizes-for="${escapeHtml(p.id)}">
                ${sizes.length ? sizes.map(s => `
                  <button type="button" class="size-row ${s.key === selectedKey && selectedKey ? "selected" : ""}" data-size-select="${escapeHtml(p.id)}" data-size="${escapeHtml(s.key)}">
                    <span class="size-name">${escapeHtml(state.lang === "ar" ? s.ar : s.en)}</span>
                    <span class="size-price">${formatPrice(s.price)}</span>
                    <span class="size-check">✓</span>
                  </button>`).join("") : `<div class="size-row"><span class="size-name">${state.lang === "en" ? "Price unavailable" : "السعر غير متوفر"}</span></div>`}
              </div>
              ${sizes.length ? `<button class="add-btn" data-add="${escapeHtml(p.id)}" data-size="${escapeHtml(selectedKey)}">${state.lang === "en" ? "Add to Cart" : "أضف للسلة"} 🛒</button>` : ""}
            </div>
          </article>`;
      }).join("");

      $("products").querySelectorAll("[data-size-select]").forEach(sizeBtn => {
        sizeBtn.addEventListener("click", () => {
          const productId = sizeBtn.dataset.sizeSelect;
          const card = sizeBtn.closest("[data-product-card]");
          if (!card) return;
          card.querySelectorAll("[data-size-select]").forEach(x => x.classList.remove("selected"));
          sizeBtn.classList.add("selected");
          const addBtn = card.querySelector("[data-add]");
          if (addBtn) addBtn.dataset.size = sizeBtn.dataset.size;
        });
      });
      $("products").querySelectorAll("[data-add]").forEach(btn => {
        btn.addEventListener("click", () => {
          if (!btn.dataset.size) {
            showToast(state.lang === "en" ? "Choose a size first" : "اختر الحجم أولاً");
            return;
          }
          addToCart(btn.dataset.add, btn.dataset.size);
        });
      });
    }

    function renderAds() {
      const groups = { top: $("adTop"), middle: $("adMiddle"), bottom: $("adBottom") };
      Object.values(groups).forEach(el => { el.className = "ad"; el.innerHTML = ""; });

      state.ads.forEach(ad => {
        const position = String(ad.position || ad.placement || "middle").toLowerCase();
        const target = groups[position] || groups.middle;
        const image = ad.image_url || ad.image;
        if (!image) return;
        const content = `<img loading="lazy" src="${escapeHtml(image)}" alt="${escapeHtml(text(ad.title, ad.title_en) || "Advertisement")}" />`;
        target.innerHTML += ad.link_url
          ? `<a href="${escapeHtml(ad.link_url)}" target="_blank" rel="noopener">${content}</a>`
          : content;
        target.classList.add("visible");
      });
    }

    function renderContact() {
      const phone = setting("phone");
      const wa = whatsappNumber(setting("whatsapp_number") || phone);
      $("addressValue").textContent = state.lang === "en" ? setting("address_en") : setting("address");
      $("phoneValue").textContent = phone || "—";
      $("phoneBtn").href = phone ? `tel:${String(phone).replace(/[^\d+]/g,"")}` : "#";
      $("whatsappBtn").href = wa ? `https://wa.me/${wa}` : "#";
    }

    function renderMenuLinks() {
      const links = [
        { label: state.lang === "en" ? "Menu" : "القائمة", href: "#menuSection" },
        { label: state.lang === "en" ? "Location & Contact" : "الموقع والتواصل", href: "#contact" }
      ];
      $("menuLinks").innerHTML = links.map(x => `<a class="menu-link" href="${x.href}">${escapeHtml(x.label)}</a>`).join("");
      $("menuLinks").querySelectorAll("a").forEach(a => a.addEventListener("click", closeMenu));
    }

    function saveCart() {
      localStorage.setItem("t3_cart", JSON.stringify(state.cart));
    }

    function cartKey(productId, sizeKey) {
      return `${productId}__${sizeKey}`;
    }

    function addToCart(productId, sizeKey) {
      const product = state.products.find(p => p.id === productId);
      if (!product) return;
      const sizes = product.sizes || {};
      const size = sizes[sizeKey];
      if (!size || !size.enabled) return;

      const key = cartKey(productId, sizeKey);
      const existing = state.cart.find(x => x.key === key);
      if (existing) existing.qty += 1;
      else state.cart.push({
        key, productId, sizeKey, qty: 1,
        name: product.name, name_en: product.name_en,
        price: Number(size.price) || 0
      });
      saveCart();
      updateCart();
      showToast(state.lang === "en" ? "Added to cart" : "تمت الإضافة للسلة");
    }

    function changeQty(key, delta) {
      const item = state.cart.find(x => x.key === key);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) state.cart = state.cart.filter(x => x.key !== key);
      saveCart();
      updateCart();
    }

    function removeCartItem(key) {
      state.cart = state.cart.filter(x => x.key !== key);
      saveCart();
      updateCart();
    }

    function updateCart() {
      const count = state.cart.reduce((sum, x) => sum + x.qty, 0);
      const total = state.cart.reduce((sum, x) => sum + (Number(x.price) * x.qty), 0);
      $("cartCount").textContent = count;
      $("cartTotal").textContent = formatPrice(total);

      if (!state.cart.length) {
        $("cartItems").innerHTML = `
          <div class="empty">
            <div class="empty-icon">🛒</div>
            <strong>${state.lang === "en" ? "Your cart is empty" : "السلة فارغة"}</strong>
          </div>`;
        return;
      }

      $("cartItems").innerHTML = state.cart.map(item => {
        const productName = text(item.name, item.name_en);
        const sizeLabel = sizeLabels[item.sizeKey]
          ? text(sizeLabels[item.sizeKey].ar, sizeLabels[item.sizeKey].en)
          : item.sizeKey;
        const subtotal = Number(item.price) * item.qty;
        return `
          <div class="cart-item">
            <div class="cart-line">
              <div>
                <div class="cart-name">${escapeHtml(productName)}</div>
                <div class="cart-meta">${escapeHtml(sizeLabel)} · ${formatPrice(item.price)}</div>
              </div>
              <strong>${formatPrice(subtotal)}</strong>
            </div>
            <div class="qty">
              <button data-qkey="${escapeHtml(item.key)}" data-delta="-1">−</button>
              <strong>${item.qty}</strong>
              <button data-qkey="${escapeHtml(item.key)}" data-delta="1">+</button>
              <button class="remove" data-remove="${escapeHtml(item.key)}">${state.lang === "en" ? "Remove" : "حذف"}</button>
            </div>
          </div>`;
      }).join("");

      $("cartItems").querySelectorAll("[data-qkey]").forEach(btn => {
        btn.addEventListener("click", () => changeQty(btn.dataset.qkey, Number(btn.dataset.delta)));
      });
      $("cartItems").querySelectorAll("[data-remove]").forEach(btn => {
        btn.addEventListener("click", () => removeCartItem(btn.dataset.remove));
      });
    }

    function openCustomerModal(){
      if(!state.cart.length){showToast(state.lang==="en"?"Your cart is empty":"السلة فارغة");return;}
      $("customerModal").classList.add("open");
      $("customerModal").setAttribute("aria-hidden","false");
      $("customerName").value="";
      $("customerPhone").value="";
      setTimeout(()=>$(("customerName")).focus(),80);
    }
    function closeCustomerModal(){$("customerModal").classList.remove("open");$("customerModal").setAttribute("aria-hidden","true");}
    async function confirmOrderViaWhatsApp(){
      const name=$("customerName").value.trim(), phone=$("customerPhone").value.trim();
      if(!name){showToast(state.lang==="en"?"Customer name is required":"اسم العميل مطلوب");$("customerName").focus();return;}
      const total=state.cart.reduce((sum,x)=>sum+Number(x.price)*x.qty,0);
      let message=state.lang==="en"?"Hello, I would like to order from the menu\n\n":"السلام عليكم، أريد طلب من المنيو\n\n";
      message+=state.lang==="en"?`Customer name: ${name}\n`:`اسم العميل: ${name}\n`;
      if(phone)message+=state.lang==="en"?`Phone: ${phone}\n`:`رقم الجوال: ${phone}\n`;
      message+="\n";
      state.cart.forEach(item=>{
        const n=text(item.name,item.name_en);
        const z=sizeLabels[item.sizeKey]?text(sizeLabels[item.sizeKey].ar,sizeLabels[item.sizeKey].en):item.sizeKey;
        message+=`• ${n} - ${z} × ${item.qty} = ${formatPrice(Number(item.price)*item.qty)}\n`;
      });
      message+=`\n${state.lang==="en"?"Total":"الإجمالي"}: ${formatPrice(total)}`;
      const wa=whatsappNumber(setting("whatsapp_number")||setting("phone"));
      if(!wa){showToast(state.lang==="en"?"WhatsApp number is not configured":"رقم الواتساب غير مضبوط");return;}
      closeCustomerModal();
      window.open(`https://wa.me/${wa}?text=${encodeURIComponent(message)}`,"_blank","noopener");
    }

    function openCart() {
      $("cartDrawer").classList.add("open");
      $("drawerBackdrop").classList.add("open");
    }
    function closeCart() {
      $("cartDrawer").classList.remove("open");
      $("drawerBackdrop").classList.remove("open");
    }
    function openMenu() {
      $("mobileMenu").classList.add("open");
      $("drawerBackdrop").classList.add("open");
    }
    function closeMenu() {
      $("mobileMenu").classList.remove("open");
      if (!$("cartDrawer").classList.contains("open")) $("drawerBackdrop").classList.remove("open");
    }

    function showToast(message) {
      $("toast").textContent = message;
      $("toast").classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => $("toast").classList.remove("show"), 2400);
    }

    $("search").addEventListener("input", e => {
      state.search = e.target.value;
      renderProducts();
    });

    $("langBtn").addEventListener("click", () => {
      state.lang = state.lang === "ar" ? "en" : "ar";
      localStorage.setItem("t3_lang", state.lang);
      renderStatic();
      renderCategories();
      renderProducts();
      renderContact();
      renderMenuLinks();
      updateCart();
    });

    $("cartBtn").addEventListener("click", openCart);
    $("closeCart").addEventListener("click", closeCart);
    $("drawerBackdrop").addEventListener("click", () => {
      closeCart();
      closeMenu();
    });
    $("menuBtn").addEventListener("click", openMenu);
    $("closeMenu").addEventListener("click", closeMenu);
    $("orderBtn").addEventListener("click", openCustomerModal);
    $("closeCustomerModal").addEventListener("click", closeCustomerModal);
    $("cancelCustomerBtn").addEventListener("click", closeCustomerModal);
    $("confirmOrderBtn").addEventListener("click", confirmOrderViaWhatsApp);
    $("customerModal").addEventListener("click",e=>{if(e.target===$("customerModal"))closeCustomerModal();});
    $("clearCartBtn").addEventListener("click", () => {
      state.cart = [];
      saveCart();
      updateCart();
    });
    $("heroMenuBtn").addEventListener("click", () => $("menuSection").scrollIntoView({ behavior:"smooth" }));
    $("heroWhatsappBtn").addEventListener("click", () => {
      const wa = whatsappNumber(setting("whatsapp_number") || setting("phone"));
      if (wa) window.open(`https://wa.me/${wa}`, "_blank", "noopener");
    });

    // تشغيل أولي
    renderStatic();
    renderCategories();
    renderProducts();
    renderContact();
    renderMenuLinks();
    updateCart();
    loadData();
  </script>
</body>
</html>
